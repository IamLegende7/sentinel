[Multithreading]
multithreading=true
# -1 for as many the os allows
num_threads=5

[Renderring]
# If the standard SDL3 renderring should be used. Less efficient, but I'll still keep this as a option
software_renderring=false
# Just please dont change this, it will break stuff
gpu_driver=vulkan

[Status]
# These settings get changed in-code, if something went wrong.
# The values here are just the defaults.

# if the fonts loaded correctly; aka if the game will write text using SDL's TTF fonts or using SDL's Debug text
using_fonts=true